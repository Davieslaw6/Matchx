[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "match-x-backend"
version = "0.2.0"
description = "Private single-owner football analysis assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.15,<2",
  "structlog>=25,<26",
  "argon2-cffi>=23.1,<26",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "pandas>=2.2,<3",
  "httpx>=0.28,<1",
  "rapidfuzz>=3.12,<4"
]
[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "hypothesis>=6.125,<7",
  "respx>=0.22,<1",
  "freezegun>=1.5,<2",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "bandit>=1.8,<2",
  "pytest-cov>=6,<7"
]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["I001"]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
