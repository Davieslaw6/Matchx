name: MATCH X CI
on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: matchx
          POSTGRES_USER: matchx
          POSTGRES_PASSWORD: matchx-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matchx -d matchx"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q --cov=app.prediction --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://matchx:matchx-ci-password@localhost:5432/matchx
          SESSION_SECRET: ci-only-not-for-production
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
